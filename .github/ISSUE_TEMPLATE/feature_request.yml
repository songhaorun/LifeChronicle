name: 功能建议
description: 提议一个有明确用户价值、边界和验收方式的能力
title: "feat: "
labels:
  - enhancement
body:
  - type: input
    id: work_package
    attributes:
      label: 关联工作包或计划项
      placeholder: M7-03 / E10-02 / 新提案
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 不要先描述实现；说明用户、调用者和未解决的问题。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 可演示结果
      description: 完成后如何独立验证价值？
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      placeholder: |
        范围：
        非目标：
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 契约、架构与兼容影响
      description: 列出 Proto、Registry、Topic、API、WIT、DDL、ADR、consumer、迁移和回滚。
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 数据、安全与隐私
      description: 说明采集授权、隐私等级、保留、删除、公开、审计和失败关闭。
    validations:
      required: true

  - type: textarea
    id: third_party
    attributes:
      label: 第三方与来源
      description: 列出依赖、API、数据、资产、许可证和 clean-room 边界；没有时写“无”并说明。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与不采用理由
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收、故障与回滚
      description: 给出正常、拒绝、故障、恢复和性能验收。
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: 原则确认
      options:
        - label: 新数据和新 Card 默认私有/关闭
          required: true
        - label: 我没有假设尚未存在的 CI、阶段门或生产能力
          required: true
